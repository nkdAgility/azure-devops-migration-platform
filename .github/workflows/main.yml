name: CI/CD Build

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  release:
    types: [published]

jobs:
  # ── Single CI job: one build per event ──────────────────────────────────────
  ci:
    name: Build and Test
    # net481 targets require Windows; build.ps1 is the single entry point
    runs-on: windows-latest
    # The integration-tests environment is the federated-credential subject of the shared Entra test
    # app (infra/test-env, same as azure-devops-migration-tools); no PAT or secret is stored.
    # Untrusted runs (PRs from forks) use integration-tests-forks, which requires reviewer approval.
    environment: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'integration-tests' || 'integration-tests-forks' }}
    permissions:
      checks: write
      contents: read
      pull-requests: write
      id-token: write
    outputs:
      semver: ${{ steps.version.outputs.semVer }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "6.1.0"

      - name: Determine Version
        id: version
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true
          configFilePath: .build/GitVersion.yml

      - name: Restore
        run: dotnet restore DevOpsMigrationPlatform.slnx

      - name: Build
        run: pwsh ./build.ps1 -Mode Build

      - name: Verify SchemaGenerator connector references
        run: |
          $csproj = Get-Content "src/DevOpsMigrationPlatform.SchemaGenerator/DevOpsMigrationPlatform.SchemaGenerator.csproj" -Raw
          $connectors = @("Infrastructure.Simulated", "Infrastructure.AzureDevOps", "Infrastructure.TfsObjectModel")
          $missing = $connectors | Where-Object { $csproj -notmatch $_ }
          if ($missing) { Write-Host "Missing SchemaGenerator connector references: $($missing -join ', ')" -ForegroundColor Red; exit 1 }
          Write-Host "All connector references present in SchemaGenerator.csproj"
        shell: pwsh

      - name: Test
        timeout-minutes: 3
        run: pwsh ./build.ps1 -Mode Test

      - name: System Test (Smoke)
        timeout-minutes: 2
        run: pwsh ./build.ps1 -Mode SystemTest_Smoke

      - name: System Test (Simulated)
        timeout-minutes: 10
        run: pwsh ./build.ps1 -Mode SystemTest_Simulated

      - name: Sign in to Entra (GitHub OIDC, shared test app)
        # Skipped when the identity is not configured (e.g. a fork without the repo variables).
        if: ${{ vars.AZURE_TEST_CLIENT_ID != '' && vars.AZURE_TEST_TENANT_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_TEST_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TEST_TENANT_ID }}
          allow-no-subscriptions: true

      - name: System Test (Live)
        if: ${{ vars.AZURE_TEST_CLIENT_ID != '' && vars.AZURE_TEST_TENANT_ID != '' }}
        timeout-minutes: 10
        shell: pwsh
        env:
          AZDEVOPS_SYSTEM_TEST_ORG: ${{ vars.AZDEVOPS_SYSTEM_TEST_ORG }}
        run: |
          # An Entra access token is accepted wherever a PAT is, so the live tests use it unchanged.
          # It exists only in this step's process environment: it is never written to GITHUB_ENV, so
          # later steps cannot read it.
          $token = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
          if ($LASTEXITCODE -ne 0 -or -not $token) { throw 'Could not get an Azure DevOps token for the test app.' }
          Write-Host "::add-mask::$token"
          $env:AZDEVOPS_SYSTEM_TEST_PAT = $token
          ./build.ps1 -Mode SystemTest_Live
          $code = $LASTEXITCODE
          $env:AZDEVOPS_SYSTEM_TEST_PAT = $null
          az logout 2>$null
          exit $code

      - name: Package
        if: github.event_name != 'pull_request'
        run: pwsh ./build.ps1 -Mode Package

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/**/*.trx

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: TestResults/**/*.trx
          reporter: dotnet-trx

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: release-packages
          path: '.output/build/MigrationTools-*.zip'
          if-no-files-found: error

  # ── Preview release: auto-create on main push ──────────────────────────────
  preview-release:
    name: Create Preview Release
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.ci.outputs.semver }}
          name: v${{ needs.ci.outputs.semver }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/*.zip

  # ── Production release: upload assets to manually-created release ───────────
  release-assets:
    name: Upload Release Assets
    needs: ci
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release-assets

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
    
