title = "azure-devops-migration-platform gitleaks config"

[extend]
useDefault = true

# Azure Monitor / Application Insights connection strings in appsettings.json are
# ingestion-only (write telemetry, cannot read it) and intentionally shipped with
# the CLI, Control Plane and agents. Allowlisted by operator decision on PR #132.
#
# regexTarget "match" tests only the finding's own matched text (for this
# connection string, generic-api-key matches "Key=<guid>;"), so any other
# credential on the same line is still reported as its own finding.
[allowlist]
description = "Application Insights ingestion connection strings"
regexTarget = "match"
regexes = [
  '''^Key=[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12};$''',
]
