version: 2
default_policy:
  mode: "fail-closed"
  rule: "Classify activity first; inspect first_surfaces before any cross-domain search."
activities:
  package:
    intent: "Package shape and output files"
    profile: "package-runtime"
    triggers:
      - "output files"
      - "folder structure"
      - "nested folder"
      - "package path"
      - "package shape"
      - "manifest in package"
    first_surfaces:
      - "src/DevOpsMigrationPlatform.Infrastructure.Agent/Package/*"
      - "src/**/Package*"
      - ".agents/30-context/domains/package-manager.md"
      - ".agents/30-context/domains/migration-package-concept.md"
    escalation_order:
      - "agent"
      - "control-plane"
  agent:
    intent: "Runtime execution behavior across package, ADO, and TFS flows"
    profile: "package-runtime"
    triggers:
      - "execution"
      - "phase run"
      - "job execution"
      - "export runtime"
      - "prepare runtime"
      - "import runtime"
      - "validate runtime"
      - "ado"
      - "tfs"
    first_surfaces:
      - "src/DevOpsMigrationPlatform.MigrationAgent/*"
      - "src/DevOpsMigrationPlatform.Infrastructure.Agent/*"
      - ".agents/30-context/domains/job-lifecycle.md"
    escalation_order:
      - "package"
      - "connectors"
      - "control-plane"
  control-plane:
    intent: "Control plane communications and job signaling"
    profile: "control-plane"
    triggers:
      - "communications"
      - "submit job"
      - "follow logs"
      - "status stream"
      - "dispatch"
      - "client server"
    first_surfaces:
      - "src/DevOpsMigrationPlatform.ControlPlane/*"
      - "src/DevOpsMigrationPlatform.CLI.Migration/Services/*ControlPlane*"
      - ".agents/30-context/domains/control-plane-concept.md"
    escalation_order:
      - "agent"
      - "cli"
  cli:
    intent: "CLI rendering, parsing, and command parameter behavior"
    profile: "cli-tui"
    triggers:
      - "render"
      - "command line params"
      - "flags"
      - "option parsing"
      - "command validation"
      - "console output"
    first_surfaces:
      - "src/DevOpsMigrationPlatform.CLI.*/Commands/*"
      - "src/DevOpsMigrationPlatform.CLI.*/Infrastructure/*"
      - ".agents/30-context/domains/cli-commands.md"
      - ".agents/30-context/domains/ui-mode-summary.md"
    escalation_order:
      - "agent"
      - "control-plane"
  connectors:
    intent: "Connector adapters and capability behavior (Simulated, AzureDevOpsServices, TeamFoundationServer)"
    profile: "connectors"
    triggers:
      - "connector"
      - "adapter"
      - "simulated"
      - "azure devops api"
      - "ado sdk"
      - "tfs object model"
      - "capability flag"
      - "pagination"
    first_surfaces:
      - "src/DevOpsMigrationPlatform.Infrastructure.AzureDevOps/*"
      - "src/DevOpsMigrationPlatform.Infrastructure.Simulated/*"
      - "src/DevOpsMigrationPlatform.Infrastructure.TfsObjectModel/*"
      - ".agents/30-context/domains/connector-model.md"
    escalation_order:
      - "agent"
      - "package"
  tests:
    intent: "Test-only changes: categories, DSL, fixtures, flakiness, coverage"
    profile: "tests"
    triggers:
      - "failing test"
      - "flaky test"
      - "test category"
      - "test tag"
      - "test dsl"
      - "coverage"
      - "fixture"
      - "trx"
    first_surfaces:
      - "tests/*"
      - ".agents/20-guardrails/workflow/testing-rules.md"
      - "docs/testing-guide.md"
    escalation_order:
      - "agent"
      - "cli"
  docs:
    intent: "Documentation-only changes to docs/, ADRs, or agent context"
    profile: "docs-only"
    triggers:
      - "documentation"
      - "docs update"
      - "readme"
      - "guide"
      - "adr text"
      - "context file"
    first_surfaces:
      - "docs/*"
      - ".agents/30-context/*"
      - ".agents/90-index/context-index.md"
    escalation_order:
      - "harness"
  harness:
    intent: "The agent harness itself: guardrails, contracts, routing, skills, workflows, stubs, CI governance gates"
    profile: "harness"
    triggers:
      - "guardrail"
      - "routing catalog"
      - "contract catalog"
      - "skill"
      - "workflow file"
      - "agents.md"
      - "stub"
      - "governance gate"
    first_surfaces:
      - ".agents/*"
      - ".github/workflows/governance.yml"
      - ".agents/OWNERS"
    escalation_order:
      - "docs"
