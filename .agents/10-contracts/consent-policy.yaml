version: 1
operator_consent:
  required_for:
    - "Any Class C change"
    - "Any explicit guardrail challenge outcome"
  evidence:
    - "Recorded human approval in session"
    - "Linked ADR update"
    - "Linked contract test evidence"
  block_if_missing: true
  notes:
    - "Silently applying a Class C change is a completion blocker."
    - "Consent does not waive test or architecture evidence requirements."
standing_authorisations:
  backlog-automation:
    granted_by: "operator (Martin Hinshelwood)"
    granted_on: "2026-10-14"
    status: "ratified 2026-10-15 — effective once this file is merged to main"
    scope:
      workflows:
        - ".agents/workflows/nkda-backlog-groom-workflow.js"
        - ".agents/workflows/nkda-backlog-deliver-workflow.js"
      skills:
        - ".agents/skills/nkda-backlog-item-create"
        - ".agents/skills/nkda-backlog-item-prestart"
    permits:
      - "Create, label, assign (claim with in-progress), comment on, and add sub-issues to Backlog Items and Decisions (never close a parent; never edit issues outside the run; only issues labelled backlog-item or decision)"
      - "Commit, push a backlog/<issue>-* branch, and open a PR for the Backlog Item being delivered (overrides Constitution rule 11 for this scope only)"
      - "Enable auto-merge only when the gate computed by the workflow passes: independent verifier confidence >= 90%, every completion step passed, no unmet acceptance criteria; otherwise disable it"
      - "Create and delete adpe2e-<run-id>-* projects in the live test organisations per .agents/20-guardrails/workflow/live-test-environment.md"
    does_not_permit:
      - "Any Class C change inside a Backlog Item without its own recorded consent"
      - "Force-push, direct push to main, deleting branches other than the run's own, or merging without the auto-merge rule"
      - "Writing credentials to any file, log, issue, or PR"
